<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body style="background-image: url(https://i.pinimg.com/1200x/90/2c/86/902c86ad46ffd2b5e2f1a00ef12d7145.jpg);background-size: cover;">
    <h1 style="text-align: center; color: brown; font-size: 50px;"><b>Register Form</b></h1><br>
  
    <form action="" style="width: 20vw; height: 65vh; border: 2px solid brown; margin:30px auto; border-radius: 15px; padding: 15px; background-color: rgba(240, 128, 128, 0.799);">
        <h2 style="text-align: center;color: rgb(80, 6, 6); font-size: 30px;">Register</h2>
        <label style="font-size: 20px; margin-top: 30px; font-family: 'Times New Roman', Times, serif;" for="">User</label><br>
        <input style="width: 95%; height: 30px; border: 1px solid; border-radius: 10px; font-size: 15px; margin-bottom: 10px; background-color: rgba(128, 128, 128, 0.44);" type="text"><br>
        
        <label style="font-size: 20px; margin-top: 30px;" for="">Email</label><br>
        <input style="width: 95%; height: 30px; border: 1px solid; border-radius: 10px; font-size: 15px;margin-bottom: 10px; background-color: rgba(128, 128, 128, 0.375);" type="Email"><br>
        
        <label style="font-size: 20px; margin-top: 30px;" for="">Password</label><br>
        <input style="width: 95%; height: 30px; border: 1px solid; border-radius: 10px; font-size: 15px; margin-bottom: 10px;background-color: rgba(128, 128, 128, 0.31);" type="Password">

        <button style="margin-top: 15px; width: 98%; height: 40px; font-size: 20px; border-radius: 15px;border: 1solid rgba(78, 8, 8, 0.904); background-color: rgba(207, 119, 119, 0.796);">Sign Up</button>
        <p style="text-align: center;">OR</p>
        <p style="text-align: center;">-------------- Sign-Up with ---------------</p>
        <button style="width: 95%;height: 35px; border-radius: 10px;border: 0px; background-color: rgb(206, 116, 129);">Google</button><br><br>
        <button style="width: 95%;height: 35px; border-radius: 10px;border: 0px; background-color: rgb(206, 116, 129);">Facebook</button>
        
    </form>
</body>
</html>
