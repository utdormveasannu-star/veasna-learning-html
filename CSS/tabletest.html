<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2"; style="width: 10%;height: 20px;border-color: blueviolet">
       <tr>
        <th colspan="4">A</th>
       </tr>
       <tr align="center">
        <td colspan="3">B</td>
        <td rowspan="3">C</td>
       </tr>
       <tr align="center">
        <td>D</td>
        <td>E</td>
        <td rowspan="2">H</td>
       </tr>
       <tr align="center">
        <td>F</td>
        <td>G</td>
       </tr>
    </table>
</body>
</html>
