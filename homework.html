<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="background-image: url(/img/IMG_6464.JPG); width: 100%;">
    <h1 style="text-align: center; color:rgba(222, 130, 9, 0.933); font-size: 50px;">Login Form</h1>
    <hr size="5" color="orange"><br>

    <form action="" style="border: 2px solid; color:rgba(235, 139, 5, 0.996); border-radius: 20px; padding: 15px; width: 30vw; height: 60vh; margin: auto; background-color: rgba(239, 154, 8, 0.629);">
        <h2 style="text-align: center; color:rgb(4, 96, 12); font-size: 30px">USER LOGIN</h2>
        <label style="font-size: 20px; color: rgb(4, 95, 11);" for="Email">Email</label>
        <input style="width: 90%; height: 35px; border-radius: 10px; margin-top: 10px" type="Email" placeholder="  Please enter your email"><br><br>
        <label style="font-size: 20px; color: rgb(6, 96, 13);" for="Password">Password</label>
        <input style="width: 90%; height: 35px; border-radius: 10px; margin-top: 10px;" type="Password" placeholder="   Please kindly enter your password">
        <br><br><br><br>
        <button  style="width: 90%; text-align: center; height: 35px; border-radius: 10px;">Login</button>
    </form>
</body>
</html>
